<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 12px; }
    #reader { width: 100%; }
    #estado { padding: 10px; margin: 10px 0; border-radius: 6px; background: #eef; }
    .ok { background: #dfd !important; } .dup { background: #ffd !important; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td, th { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; word-break: break-all; }
    #contador { display: inline-block; background: #1a73e8; color: #fff;
      border-radius: 20px; padding: 2px 12px; font-size: 16px; margin-left: 8px; }
  </style>
</head>
<body>
  <h2>Lector de QR <span id="contador">0</span></h2>
  <div id="reader"></div>
  <div id="estado">Apunta la cámara a un código QR</div>

  <div id="asignar" style="display:none; margin:10px 0;">
    <div><b>QR leído:</b> <span id="qrLeido"></span></div>
    <input id="asignado" placeholder="Asignar a..." style="width:100%; padding:10px; margin:8px 0; box-sizing:border-box;">
    <button onclick="confirmar()" style="padding:10px 16px;">Guardar</button>
    <button onclick="cancelar()" style="padding:10px 16px;">Cancelar</button>
  </div>

  <h3>Últimos registros</h3>
  <table id="tabla"><tr><th>Fecha</th><th>Contenido</th><th>Asignado</th></tr></table>

  <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbx5txFJgDQh3DNKzrPWAMF8pRRsFxp55R1a_P1V7rFVejTAjzHThHW002gjWZk3E5pBFQ/exec';

    let bloqueado = false;
    let qrPendiente = '';

    function cargarContador() {
      fetch(URL_SCRIPT + '?accion=contar')
        .then(r => r.json())
        .then(d => document.getElementById('contador').textContent = d.total);
    }

    function cargarLista() {
      cargarContador();
      fetch(URL_SCRIPT + '?accion=listar')
        .then(r => r.json())
        .then(filas => {
          const t = document.getElementById('tabla');
          t.innerHTML = '<tr><th>Fecha</th><th>Contenido</th><th>Asignado</th></tr>';
          filas.forEach(f => {
            const tr = t.insertRow();
            tr.insertCell().textContent = f[0];
            tr.insertCell().textContent = f[1];
            tr.insertCell().textContent = f[2];
          });
        });
    }

    function alLeer(texto) {
      if (bloqueado) return;
      bloqueado = true;
      qrPendiente = texto;
      document.getElementById('qrLeido').textContent = texto;
      document.getElementById('asignado').value = '';
      document.getElementById('asignar').style.display = 'block';
      document.getElementById('asignado').focus();
    }

    function confirmar() {
      const asignado = document.getElementById('asignado').value.trim();
      if (!asignado) { alert('Escribe a quién o qué se asigna'); return; }
      const est = document.getElementById('estado');
      est.textContent = 'Guardando...';

      const url = URL_SCRIPT + '?accion=guardar&texto=' + encodeURIComponent(qrPendiente) + '&asignado=' + encodeURIComponent(asignado);

      fetch(url)
        .then(r => r.json())
        .then(r => {
          est.className = r.duplicado ? 'dup' : 'ok';
          est.textContent = (r.duplicado ? 'Ya registrado: ' : 'Guardado: ') + qrPendiente;
          cancelar();
          cargarLista();
        })
        .catch(e => { est.textContent = 'Error: ' + e.message; });
    }

    function cancelar() {
      document.getElementById('asignar').style.display = 'none';
      qrPendiente = '';
      setTimeout(() => { bloqueado = false; }, 1500);
    }

    const lector = new Html5QrcodeScanner('reader', { fps: 10, qrbox: 250 }, false);
    lector.render(alLeer, () => {});
    cargarLista();
  </script>
</body>
</html>
