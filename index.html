<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 12px; }
    #reader { width: 100%; }
    #estado { padding: 12px; margin: 10px 0; border-radius: 6px; background: #eef; font-size: 15px; }
    .ok { background: #dfd !important; } .dup { background: #ffd !important; } .error { background: #fdd !important; }
    .tipos { display: flex; gap: 8px; margin: 12px 0; }
    .tipo-btn { flex: 1; padding: 12px 4px; border: 2px solid #ccc; border-radius: 8px; background: #fff; font-size: 14px; }
    .tipo-btn.activo { border-color: #1a73e8; background: #e8f0fe; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Registro de Asistencia</h2>

  <p>Selecciona qué estás registrando:</p>
  <div class="tipos">
    <button class="tipo-btn activo" onclick="elegirTipo('Entrada', this)">Entrada</button>
    <button class="tipo-btn" onclick="elegirTipo('Taller', this)">Taller</button>
    <button class="tipo-btn" onclick="elegirTipo('Conferencia', this)">Conferencia</button>
  </div>

  <div id="reader"></div>
  <div id="estado">Apunta la cámara a un código QR</div>

  <script>
    const URL_SCRIPT = 'https://script.google.com/a/macros/usco.edu.co/s/AKfycbx5txFJgDQh3DNKzrPWAMF8pRRsFxp55R1a_P1V7rFVejTAjzHThHW002gjWZk3E5pBFQ/exec';
    let tipoActual = 'Entrada';
    let bloqueado = false;

    function elegirTipo(tipo, boton) {
      tipoActual = tipo;
      document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('activo'));
      boton.classList.add('activo');
    }

    function alLeer(idQR) {
      if (bloqueado) return;
      bloqueado = true;

      const est = document.getElementById('estado');
      est.className = '';
      est.textContent = 'Buscando...';

      const url = URL_SCRIPT + '?accion=guardarAsistencia&id=' + encodeURIComponent(idQR) + '&tipo=' + encodeURIComponent(tipoActual);

      fetch(url)
        .then(r => r.json())
        .then(r => {
          if (!r.ok) {
            est.className = 'error';
            est.textContent = 'No encontrado: ' + idQR;
          } else if (r.duplicado) {
            est.className = 'dup';
            est.textContent = r.nombre + ' ya tiene registrada su ' + r.tipo;
          } else {
            est.className = 'ok';
            est.textContent = r.nombre + ' — ' + r.tipo + ' registrada ✓';
          }
          setTimeout(() => { bloqueado = false; est.className = ''; est.textContent = 'Apunta la cámara a un código QR'; }, 2000);
        })
        .catch(e => {
          est.className = 'error';
          est.textContent = 'Error: ' + e.message;
          setTimeout(() => { bloqueado = false; }, 2000);
        });
    }

    const lector = new Html5QrcodeScanner('reader', { fps: 10, qrbox: 250 }, false);
    lector.render(alLeer, () => {});
  </script>
</body>
</html>
