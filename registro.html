<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro en sitio</title>
  <style>
    /* Impresora del PDA Netum: 58 mm (zona imprimible real ~48 mm).
       Altura fija de 58 mm para que no salga papel de sobra.
       Si corta el ID de abajo, sube 58mm a 62mm; si sobra papel, bájalo a 54mm. */
    @page { size: 58mm 58mm; margin: 0; }

    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; }
    h2 { text-align: center; margin: 8px 0 16px; }
    .caja { max-width: 420px; margin: 0 auto; background: #fff; padding: 16px; border-radius: 10px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #444; }
    input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; margin-top: 4px;
            border: 1px solid #ccc; border-radius: 6px; }
    select { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; margin-top: 4px;
             border: 1px solid #ccc; border-radius: 6px; background: #fff; }
    label.check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; }
    label.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
    button { width: 100%; margin-top: 18px; padding: 14px; font-size: 16px; border: 0;
             border-radius: 8px; background: #1a73e8; color: #fff; }
    button.sec { background: #666; margin-top: 10px; }
    button:disabled { opacity: .6; }
    #msg { margin-top: 12px; text-align: center; font-size: 14px; min-height: 18px; }
    .error { color: #c62828; }
    .ok { color: #2e7d32; }

    /* Escarapela */
    #escarapela { display: none; text-align: center; margin: 16px auto 0; padding: 4px;
                  width: 48mm; background: #fff; border: 1px dashed #aaa; }
    #escarapela .nombre { font-size: 16px; font-weight: bold; margin: 4px 0 2px; white-space: nowrap; overflow: hidden; }
    #escarapela .inst { font-size: 12px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; }
    #escarapela img { width: 34mm; height: 34mm; }
    #escarapela .id { font-size: 11px; margin-top: 2px; color: #444; }

    @media print {
      html, body { width: 58mm; height: 58mm; margin: 0; padding: 0; background: #fff; overflow: hidden; }
      .caja, h2 { display: none !important; }
      #escarapela { display: block; width: 48mm; margin: 0 auto; padding: 2mm 0 0; border: 0;
                    break-inside: avoid; page-break-after: avoid; }
    }
  </style>
</head>
<body>
  <h2>Registro en sitio</h2>

  <div class="caja" id="formulario">
    <label>Correo electrónico
      <input id="correo" type="email" autocomplete="off">
    </label>
    <label>Nombre y apellidos *
      <input id="nombre" autocomplete="off">
    </label>
    <label>Número de documento de identidad *
      <input id="documento" inputmode="numeric" autocomplete="off">
    </label>
    <label>Número telefónico
      <input id="telefono" type="tel" autocomplete="off">
    </label>
    <label>Perfil
      <select id="perfil">
        <option value="">Seleccione...</option>
        <option>Estudiante Bachiller</option>
        <option>Aprendiz SENA</option>
        <option>Estudiante Universitario</option>
        <option>Docente/Investigador</option>
        <option>Empresario/Sector Productivo</option>
        <option>Público General</option>
      </select>
    </label>
    <label>Institución a la que pertenece
      <input id="institucion" autocomplete="off">
    </label>
    <label>¿Cómo se enteró del evento?
      <select id="comoSeEntero" onchange="alternarOtro()">
        <option value="">Seleccione...</option>
        <option>Por redes sociales</option>
        <option>Por otro individuo</option>
        <option>Por alguna Empresa o Institución</option>
        <option>por Asistencia pasada</option>
        <option>Otro</option>
      </select>
    </label>
    <label id="bloqueOtro" style="display:none;">¿Cómo se enteró? (otro)
      <input id="otroMedio" autocomplete="off">
    </label>

    <label class="check">
      <input type="checkbox" id="autorizacion">
      <span>Autorizo el tratamiento de mis datos personales según la Política de Privacidad de Datos Personales de la Universidad Surcolombiana. *</span>
    </label>

    <label>Clave del staff *
      <input id="clave" type="password" autocomplete="off">
    </label>

    <button id="btnRegistrar" onclick="registrar()">Registrar e imprimir</button>
    <div id="msg"></div>
  </div>

  <div id="escarapela">
    <div class="nombre" id="eNombre"></div>
    <div class="inst" id="eInst"></div>
    <img id="eQR" alt="QR">
    <div class="id" id="eId"></div>
  </div>

  <div class="caja" id="acciones" style="display:none; margin-top:12px;">
    <button onclick="window.print()">Imprimir de nuevo</button>
    <button class="sec" onclick="nuevo()">Registrar otra persona</button>
    <div id="msg2" style="margin-top:12px; text-align:center; font-size:14px;"></div>
  </div>

<script>
  // URL /exec de la Web App (la misma que usa el lector QR)
  const API = 'https://script.google.com/macros/s/AKfycby5MEzOdmsA5YlNCLYe2DpxCUxaoXmJf4rHxXJdBYjgX_HNzwq6L6On3mO72omKOBZJXQ/exec';

  const $ = id => document.getElementById(id);

  function alternarOtro() {
    $('bloqueOtro').style.display = $('comoSeEntero').value === 'Otro' ? 'block' : 'none';
  }

  async function registrar() {
    const nombre = $('nombre').value.trim();
    const documento = $('documento').value.trim();
    const clave = $('clave').value;
    if (!nombre) return mostrar('Escribe el nombre y apellidos', true);
    if (!documento) return mostrar('Escribe el número de documento', true);
    if (!$('autorizacion').checked) return mostrar('Debe aceptar la autorización de datos', true);
    if (!clave) return mostrar('Escribe la clave del staff', true);

    $('btnRegistrar').disabled = true;
    mostrar('Registrando...', false);

    const params = new URLSearchParams({
      accion: 'registrarPersona',
      correo: $('correo').value.trim(),
      nombre: nombre,
      documento: documento,
      telefono: $('telefono').value.trim(),
      perfil: $('perfil').value,
      institucion: $('institucion').value.trim(),
      comoSeEntero: $('comoSeEntero').value,
      otroMedio: $('otroMedio').value.trim(),
      autorizacion: 'Sí',
      clave: clave
    });

    try {
      const resp = await fetch(API + '?' + params.toString());
      const texto = await resp.text();
      let r;
      try { r = JSON.parse(texto); }
      catch (e) {
        mostrar('El servidor no devolvió JSON. Revisa la URL y el despliegue de la Web App.', true);
        $('btnRegistrar').disabled = false;
        return;
      }

      if (!r.ok) {
        mostrar(r.error || 'No se pudo registrar', true);
        $('btnRegistrar').disabled = false;
        return;
      }

      // 1) Escarapela en pantalla + impresión inmediata
      $('eNombre').textContent = r.nombre;
      $('eInst').textContent = r.institucion;
      $('eId').textContent = r.id;
      $('eQR').onload = () => setTimeout(() => window.print(), 300);
      $('eQR').src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(r.id);
      $('escarapela').style.display = 'block';
      ajustarUnaLinea($('eNombre'), 16, 8);   // nombre: de 16 px hasta 8 px como mínimo
      ajustarUnaLinea($('eInst'), 12, 7);     // institución: de 12 px hasta 7 px como mínimo
      $('formulario').style.display = 'none';
      $('acciones').style.display = 'block';
      if (r.yaRegistrado) alert('Este documento ya estaba registrado. Se reimprime su escarapela.');

      // 2) En segundo plano: guardar QR y escarapela PDF en Drive
      $('msg2').className = 'ok';
      $('msg2').textContent = 'Guardando QR y escarapela en Drive...';
      guardarArchivos(r.id, clave);
    } catch (err) {
      mostrar('Error de conexión: ' + err.message, true);
      $('btnRegistrar').disabled = false;
    }
  }

  // Reduce la letra hasta que el texto quepa en UNA sola línea.
  // Si ni con la letra mínima cabe, permite dos líneas para no cortar el texto.
  function ajustarUnaLinea(el, maxPx, minPx) {
    el.style.whiteSpace = 'nowrap';
    el.style.overflow = 'hidden';
    let size = maxPx;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth && size > minPx) {
      size -= 0.5;
      el.style.fontSize = size + 'px';
    }
    if (el.scrollWidth > el.clientWidth) {
      el.style.whiteSpace = 'normal';
      el.style.overflow = 'visible';
    }
  }

  async function guardarArchivos(id, clave) {
    const m = $('msg2');
    try {
      const p = new URLSearchParams({ accion: 'generarArchivos', id: id, clave: clave });
      const resp = await fetch(API + '?' + p.toString());
      const r = JSON.parse(await resp.text());
      if (r.ok) {
        m.className = 'ok';
        m.textContent = '✔ Registrado. QR y escarapela guardados en Drive.';
      } else {
        m.className = 'error';
        m.textContent = 'Registrado, pero falló el guardado en Drive: ' + r.error;
      }
    } catch (e) {
      m.className = 'error';
      m.textContent = 'Registrado, pero falló el guardado en Drive: ' + e.message;
    }
  }

  function nuevo() {
    ['correo', 'nombre', 'documento', 'telefono', 'perfil', 'institucion', 'comoSeEntero', 'otroMedio', 'clave']
      .forEach(id => $(id).value = '');
    $('autorizacion').checked = false;
    alternarOtro();
    $('escarapela').style.display = 'none';
    $('acciones').style.display = 'none';
    $('msg2').textContent = '';
    $('formulario').style.display = 'block';
    $('btnRegistrar').disabled = false;
    mostrar('', false);
    $('nombre').focus();
  }

  function mostrar(texto, esError) {
    $('msg').textContent = texto;
    $('msg').className = esError ? 'error' : 'ok';
  }
</script>
</body>
</html>
